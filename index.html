<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ひらがな れんしゅう</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --c1: #E03030; --c2: #1A8A3A; --c3: #E07010; --c4: #1040C0; --c5: #8020A0;
  --bg: #FFF8F0;
  --text: #2C3450;
}

body {
  font-family: 'Hiragino Maru Gothic Pro','BIZ UDPGothic','Rounded Mplus 1c',sans-serif;
  background: var(--bg);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== HOME ===== */
#home {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px 32px;
  min-height: 100vh;
}

.home-title {
  font-size: clamp(22px,6vw,38px);
  font-weight: bold;
  color: var(--c1);
  margin-bottom: 4px;
  letter-spacing: .05em;
}

.home-sub {
  font-size: clamp(12px,3vw,16px);
  color: #999;
  margin-bottom: 20px;
}

.char-grid {
  display: grid;
  grid-template-columns: repeat(5,1fr);
  gap: 8px;
  width: 100%;
  max-width: 440px;
}

.char-btn {
  aspect-ratio: 1;
  border: none;
  border-radius: 14px;
  background: white;
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  transition: transform .13s, box-shadow .13s;
  position: relative;
  overflow: hidden;
}

.char-btn:active { transform: scale(.91); box-shadow: 0 1px 4px rgba(0,0,0,.1); }

.char-btn .kana {
  font-size: clamp(20px,5vw,30px);
  font-weight: bold;
  color: var(--text);
  line-height: 1;
}

.char-btn .roman {
  font-size: clamp(8px,1.8vw,11px);
  color: #bbb;
  font-weight: normal;
}

.char-btn.done::after {
  content: '★';
  position: absolute;
  top: 2px;
  right: 5px;
  font-size: 11px;
  color: #f0b020;
}

/* ===== PRACTICE ===== */
#practice {
  display: none;
  flex-direction: column;
  align-items: center;
  padding: 12px 16px 28px;
  min-height: 100vh;
}

.prac-header {
  width: 100%;
  max-width: 420px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.back-btn {
  width: 40px; height: 40px;
  border: none;
  border-radius: 50%;
  background: white;
  box-shadow: 0 2px 6px rgba(0,0,0,.12);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

.char-title { text-align: center; }
.char-title .big { font-size: 34px; font-weight: bold; color: var(--text); line-height: 1; }
.char-title .small { font-size: 13px; color: #aaa; }

/* difficulty toggle */
.diff-wrap {
  display: flex;
  background: #e8e8e8;
  border-radius: 30px;
  padding: 3px;
  margin-bottom: 12px;
}

.diff-btn {
  padding: 8px 18px;
  border: none;
  border-radius: 27px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  background: transparent;
  color: #888;
  transition: background .2s, color .2s;
}

.diff-btn.active {
  background: white;
  color: var(--text);
  box-shadow: 0 2px 6px rgba(0,0,0,.14);
}

/* practice area (the big drawing cell) */
.prac-cell {
  position: relative;
  width: min(88vw, 380px);
  aspect-ratio: 1;
  background: white;
  border-radius: 18px;
  box-shadow: 0 4px 20px rgba(0,0,0,.13);
  overflow: hidden;
  touch-action: none;
}

/* Horizontal notebook lines */
.nb-hlines {
  position: absolute; inset: 0;
  background-image: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 37px,
    rgba(140,175,220,.18) 37px,
    rgba(140,175,220,.18) 38px
  );
  pointer-events: none;
}

/* 4-division dotted cross */
.nb-cross-h, .nb-cross-v {
  position: absolute;
  pointer-events: none;
}

.nb-cross-h {
  top: 50%; left: 6%; right: 6%;
  height: 0;
  border-top: 1.5px dashed rgba(140,175,220,.45);
  transform: translateY(-50%);
}

.nb-cross-v {
  left: 50%; top: 6%; bottom: 6%;
  width: 0;
  border-left: 1.5px dashed rgba(140,175,220,.45);
  transform: translateX(-50%);
}

/* outer border of cell */
.nb-border {
  position: absolute; inset: 0;
  border: 1.5px solid rgba(140,175,220,.3);
  border-radius: 18px;
  pointer-events: none;
  z-index: 5;
}

/* SVG guide layer */
.guide-svg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}

/* drawing canvas */
.draw-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  cursor: crosshair;
  z-index: 3;
}

/* ===== STROKE PROGRESS ===== */
.stroke-label {
  margin-top: 12px;
  font-size: 15px;
  color: #666;
  text-align: center;
}

.stroke-dots {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 7px;
}

.dot {
  width: 13px; height: 13px;
  border-radius: 50%;
  background: #ddd;
  transition: background .25s, transform .2s;
}

.dot.done { background: #4CAF50; }
.dot.cur { background: var(--c1); transform: scale(1.25); }

/* ===== BUTTONS ===== */
.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 13px;
  width: min(88vw, 380px);
}

.btn {
  flex: 1;
  padding: 13px 10px;
  border: none;
  border-radius: 50px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: transform .13s, opacity .13s;
}

.btn:active { transform: scale(.95); }
.btn:disabled { opacity: .38; pointer-events: none; }

.btn-clear { background: #f0f0f0; color: #555; }
.btn-next  { background: var(--c1); color: white; box-shadow: 0 3px 10px rgba(224,48,48,.35); }
.btn-hide  { background: #eef0f8; color: #446; border: 1.5px solid #c0c8e0; font-size: 13px; }

/* hide button only shown in hard mode */
.hard-only { display: none; }

/* ===== NAV ===== */
.nav-row {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 11px;
}

.nav-btn {
  width: 44px; height: 44px;
  border: none;
  border-radius: 50%;
  background: white;
  box-shadow: 0 2px 8px rgba(0,0,0,.11);
  font-size: 20px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

.nav-label { font-size: 14px; color: #aaa; min-width: 55px; text-align: center; }

/* ===== COMPLETION OVERLAY ===== */
.comp-overlay {
  display: none;
  position: absolute; inset: 0;
  background: rgba(255,255,255,.93);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border-radius: 18px;
  z-index: 10;
}

.comp-overlay.show { display: flex; }
.comp-star { font-size: 60px; animation: bob .5s infinite alternate; }
.comp-text { font-size: 22px; font-weight: bold; color: var(--c1); }
.comp-text2 { font-size: 14px; color: #888; }

.comp-btns { display: flex; gap: 10px; margin-top: 6px; }
.comp-btn {
  padding: 11px 22px;
  border: none;
  border-radius: 50px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}
.comp-btn.next { background: var(--c1); color: white; }
.comp-btn.home { background: #eee; color: #444; }

@keyframes bob { from { transform: scale(1); } to { transform: scale(1.12); } }
</style>
</head>

<!-- ====== HOME ====== -->
<div id="home">
  <div class="home-title">ひらがな れんしゅう ✏️</div>
  <div class="home-sub">もじをえらんでれんしゅうしよう！</div>
  <div class="char-grid" id="char-grid"></div>
</div>

<!-- ====== PRACTICE ====== -->
<div id="practice">
  <div class="prac-header">
    <button class="back-btn" onclick="goHome()">←</button>
    <div class="char-title">
      <div class="big" id="char-disp"></div>
      <div class="small" id="read-disp"></div>
    </div>
    <div style="width:40px"></div>
  </div>

  <!-- difficulty -->
  <div class="diff-wrap">
    <button class="diff-btn active" id="d-easy" onclick="setDiff('easy')">かんたん</button>
    <button class="diff-btn"        id="d-hard" onclick="setDiff('hard')">むずかしい</button>
  </div>

  <!-- drawing cell -->
  <div class="prac-cell" id="prac-cell">
    <div class="nb-hlines"></div>
    <div class="nb-cross-h"></div>
    <div class="nb-cross-v"></div>
    <div class="nb-border"></div>
    <svg class="guide-svg" id="guide-svg" viewBox="0 0 200 200"></svg>
    <canvas class="draw-canvas" id="draw-canvas"></canvas>
    <div class="comp-overlay" id="comp-overlay">
      <div class="comp-star">⭐</div>
      <div class="comp-text">じょうずに かけたよ！</div>
      <div class="comp-text2" id="comp-char-big"></div>
      <div class="comp-btns">
        <button class="comp-btn next" onclick="goNext()">つぎのもじ →</button>
        <button class="comp-btn home" onclick="goHome()">もどる</button>
      </div>
    </div>
  </div>

  <!-- stroke info -->
  <div class="stroke-label" id="stroke-label"></div>
  <div class="stroke-dots" id="stroke-dots"></div>

  <!-- buttons -->
  <div class="btn-row">
    <button class="btn btn-clear" onclick="resetChar()">けす</button>
    <button class="btn btn-hide hard-only" id="btn-hide" onclick="toggleGuide()">ガイドをかくす</button>
    <button class="btn btn-next" id="btn-next" onclick="advanceStroke()">つぎへ →</button>
  </div>

  <!-- navigation -->
  <div class="nav-row">
    <button class="nav-btn" onclick="navChar(-1)">‹</button>
    <div class="nav-label" id="nav-label"></div>
    <button class="nav-btn" onclick="navChar(1)">›</button>
  </div>
</div>

// =====================================================
// STATE
// =====================================================
let ci = 0;           // current char index
let cs = 0;           // current stroke index
let diff = 'easy';    // 'easy' | 'hard'
let done = new Set(JSON.parse(localStorage.getItem('done')||'[]'));
let completed = [];   // strokes done this session
let guideVisible = false;
let isDrawing = false;
let lx = 0, ly = 0;
let ctx;
let autoTimer = null;

// =====================================================
// HOME
// =====================================================
function buildGrid() {
  const g = document.getElementById('char-grid');
  g.innerHTML = '';
  KANA.forEach((k,i) => {
    const b = document.createElement('button');
    b.className = 'char-btn' + (done.has(k.char) ? ' done' : '');
    b.innerHTML = `<span class="kana">${k.char}</span><span class="roman">${k.r}</span>`;
    b.onclick = () => openPractice(i);
    g.appendChild(b);
  });
}

function goHome() {
  document.getElementById('home').style.display = 'flex';
  document.getElementById('practice').style.display = 'none';
  buildGrid();
}

// =====================================================
// PRACTICE
// =====================================================
function openPractice(i) {
  ci = i; cs = 0; completed = []; guideVisible = false;
  document.getElementById('home').style.display = 'none';
  document.getElementById('practice').style.display = 'flex';
  document.getElementById('comp-overlay').classList.remove('show');
  initCanvas();
  renderAll();
}

function renderAll() {
  const k = KANA[ci];
  document.getElementById('char-disp').textContent = k.char;
  document.getElementById('read-disp').textContent = '「' + k.r + '」';
  document.getElementById('nav-label').textContent = (ci+1) + ' / ' + KANA.length;
  renderDots();
  renderGuide();
  renderLabel();
  updateHideBtn();
  clearCanvas();
}

function renderLabel() {
  const k = KANA[ci];
  const lbl = document.getElementById('stroke-label');
  if (cs >= k.s.length) {
    lbl.textContent = 'ぜんぶ かけたよ！';
  } else if (diff === 'hard') {
    lbl.textContent = 'じゆうに かいてね';
  } else {
    lbl.textContent = (cs+1) + 'かくめ を なぞってね';
  }
}

function defaultNextLabel() {
  return diff === 'hard' ? 'かけた！' : 'つぎへ →';
}

function renderDots() {
  const k = KANA[ci];
  const wrap = document.getElementById('stroke-dots');
  wrap.innerHTML = '';
  k.s.forEach((_,i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i < cs ? ' done' : i === cs ? ' cur' : '');
    wrap.appendChild(d);
  });
}

function renderGuide() {
  const svg = document.getElementById('guide-svg');
  svg.innerHTML = '';
  const k = KANA[ci];
  const NS = 'http://www.w3.org/2000/svg';

  if (diff === 'easy') {
    // かんたん: 文字を薄く背景表示 ＋ 画数の番号を表示
    const charBg = document.createElementNS(NS, 'text');
    charBg.setAttribute('x', '100');
    charBg.setAttribute('y', '152');
    charBg.setAttribute('font-size', '155');
    charBg.setAttribute('font-family', '"Hiragino Maru Gothic Pro","BIZ UDPGothic","Yu Gothic","Meiryo",sans-serif');
    charBg.setAttribute('text-anchor', 'middle');
    charBg.setAttribute('pointer-events', 'none');
    charBg.setAttribute('fill', '#3050B0');
    charBg.setAttribute('opacity', '0.12');
    charBg.textContent = k.char;
    svg.appendChild(charBg);

    // ①だけ表示（書き始めの位置を示す）
    if (cs === 0) {
      addNum(svg, 1, k.s[0].nx, k.s[0].ny, SC[0]);
    }
  } else {
    // むずかしい: 「ガイドをみる」を押した時だけ文字を表示
    if (guideVisible) {
      const charBg = document.createElementNS(NS, 'text');
      charBg.setAttribute('x', '100');
      charBg.setAttribute('y', '152');
      charBg.setAttribute('font-size', '155');
      charBg.setAttribute('font-family', '"Hiragino Maru Gothic Pro","BIZ UDPGothic","Yu Gothic","Meiryo",sans-serif');
      charBg.setAttribute('text-anchor', 'middle');
      charBg.setAttribute('pointer-events', 'none');
      charBg.setAttribute('fill', '#445566');
      charBg.setAttribute('opacity', '0.30');
      charBg.textContent = k.char;
      svg.appendChild(charBg);
    }
  }
}

function addPath(svg, d, color, w, op) {
  const p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d', d);
  p.setAttribute('stroke', color);
  p.setAttribute('stroke-width', w);
  p.setAttribute('fill', 'none');
  p.setAttribute('stroke-linecap', 'round');
  p.setAttribute('stroke-linejoin', 'round');
  p.setAttribute('opacity', op);
  svg.appendChild(p);
}

function addNum(svg, n, x, y, color) {
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 10);
  c.setAttribute('fill', 'white'); c.setAttribute('stroke', color); c.setAttribute('stroke-width', 1.5);
  g.appendChild(c);
  const t = document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x', x); t.setAttribute('y', y+4.5);
  t.setAttribute('text-anchor','middle');
  t.setAttribute('font-size','10'); t.setAttribute('font-weight','bold');
  t.setAttribute('fill', color); t.setAttribute('font-family','sans-serif');
  t.textContent = n;
  g.appendChild(t);
  svg.appendChild(g);
}

// =====================================================
// CANVAS
// =====================================================
function initCanvas() {
  const canvas = document.getElementById('draw-canvas');
  ctx = canvas.getContext('2d');
  function resize() {
    const r = canvas.parentElement.getBoundingClientRect();
    canvas.width  = r.width;
    canvas.height = r.height;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }
  resize();
  new ResizeObserver(resize).observe(canvas.parentElement);

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup',   onUp);
  canvas.addEventListener('pointercancel', onUp);
}

function strokeColor() {
  if (diff === 'hard') return '#334466';
  return SC[cs % SC.length];
}

function onDown(e) {
  e.preventDefault();
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  isDrawing = true;
  const pos = pt(e);
  lx = pos.x; ly = pos.y;
  const canvas = document.getElementById('draw-canvas');
  ctx.beginPath();
  ctx.moveTo(lx, ly);
  ctx.strokeStyle = strokeColor();
  ctx.lineWidth   = Math.max(canvas.width / 15, 14);
  ctx.globalAlpha = 0.82;
}

function onMove(e) {
  if (!isDrawing) return;
  e.preventDefault();
  const pos = pt(e);
  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y);
  lx = pos.x; ly = pos.y;
}

function onUp(e) {
  if (!isDrawing) return;
  isDrawing = false;
  ctx.closePath();
  // かんたんモード: 指を離したら1.2秒後に自動で次の画へ
  if (diff === 'easy' && cs < KANA[ci].s.length) {
    autoTimer = setTimeout(advanceStroke, 250);
  }
}

function pt(e) {
  const r = document.getElementById('draw-canvas').getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function clearCanvas() {
  const canvas = document.getElementById('draw-canvas');
  if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// =====================================================
// STROKE ADVANCE
// =====================================================
function advanceStroke() {
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  const k = KANA[ci];
  if (cs >= k.s.length) { resetChar(); return; }
  if (diff === 'hard') {
    completed = k.s.map((_, i) => i);
    cs = k.s.length;
  } else {
    completed.push(cs);
    cs++;
  }
  guideVisible = false;
  updateHideBtn();
  if (diff !== 'easy') clearCanvas();
  renderDots();
  renderGuide();
  renderLabel();

  if (cs >= k.s.length) {
    setTimeout(() => {
      document.getElementById('comp-char-big').textContent = k.char + '（' + k.r + '）';
      document.getElementById('comp-overlay').classList.add('show');
      done.add(k.char);
      localStorage.setItem('done', JSON.stringify([...done]));
    }, 350);
    document.getElementById('btn-next').textContent = 'もういちど';
  } else {
    document.getElementById('btn-next').textContent = defaultNextLabel();
  }
}

function resetChar() {
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  cs = 0; completed = []; guideVisible = false;
  document.getElementById('comp-overlay').classList.remove('show');
  document.getElementById('btn-next').textContent = defaultNextLabel();
  clearCanvas();
  renderAll();
}

function goNext() {
  navChar(1);
}

function navChar(dir) {
  ci = (ci + dir + KANA.length) % KANA.length;
  cs = 0; completed = []; guideVisible = false;
  document.getElementById('comp-overlay').classList.remove('show');
  document.getElementById('btn-next').textContent = defaultNextLabel();
  renderAll();
}

// =====================================================
// DIFFICULTY
// =====================================================
function setDiff(d) {
  diff = d;
  document.getElementById('d-easy').classList.toggle('active', d==='easy');
  document.getElementById('d-hard').classList.toggle('active', d==='hard');
  document.querySelectorAll('.hard-only').forEach(el => {
    el.style.display = d === 'hard' ? 'block' : 'none';
  });
  guideVisible = false;
  updateHideBtn();
  renderGuide();
  renderLabel();
  document.getElementById('btn-next').textContent = defaultNextLabel();
}

// =====================================================
// GUIDE TOGGLE (hard mode)
// =====================================================
function toggleGuide() {
  guideVisible = !guideVisible;
  updateHideBtn();
  renderGuide();
}

function updateHideBtn() {
  const btn = document.getElementById('btn-hide');
  btn.textContent = guideVisible ? 'ガイドをかくす' : 'ガイドをみる';
}

// =====================================================
// INIT
// =====================================================
buildGrid();
</script>
